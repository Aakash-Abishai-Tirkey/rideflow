name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests -v --tb=short

      - name: CLI smoke test (simulator -> pipeline -> data quality)
        run: |
          python -m rideflow.simulator.engine --days 1 --reset
          python -m rideflow.orchestrator run
          python -m rideflow.pipeline.dq run
